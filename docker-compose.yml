services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comba_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - vendor_vol:/var/www/html/vendor
      - ./docker/php-overrides.ini:/usr/local/etc/php/conf.d/z-overrides.ini
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - comba_net

  webserver:
    image: nginx:1.25-alpine
    container_name: comba_nginx
    restart: unless-stopped
    ports:
      - "8002:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - comba_net

  mysql:
    image: mysql:8.0
    container_name: comba_mysql
    restart: unless-stopped
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DOCKER_MYSQL_ROOT_PASSWORD:?Define DOCKER_MYSQL_ROOT_PASSWORD en tu .env}
      MT_DB_USER: ${DOCKER_MYSQL_USER:?Define DOCKER_MYSQL_USER en tu .env}
      MT_DB_PASSWORD: ${DOCKER_MYSQL_PASSWORD:?Define DOCKER_MYSQL_PASSWORD en tu .env}
      MT_DB_NAME: ${DOCKER_MYSQL_DATABASE:-multitenant_laravel}
      MT_DB_LEGACY_NAME: ${DOCKER_MYSQL_LEGACY_DATABASE:-multitenant}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --bind-address=0.0.0.0
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DOCKER_MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - comba_net

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: comba_phpmyadmin
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DOCKER_PMA_USER:?Define DOCKER_PMA_USER en tu .env}
      PMA_PASSWORD: ${DOCKER_PMA_PASSWORD:?Define DOCKER_PMA_PASSWORD en tu .env}
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 200M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - comba_net

volumes:
  mysql_data:
    driver: local
  vendor_vol:
    driver: local

networks:
  comba_net:
    driver: bridge